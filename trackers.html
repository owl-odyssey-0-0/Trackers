<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --paper: #FAF3E6; --paper-dark: #F1E7D4; --ink: #2E3548;
    --ink-soft: #6B7280; --line: #DCCBA8; --gold: #B08D57; --white: #FFFDF9;
    --accent: #C74A3D;
  }
  body.sec-bad{ --paper:#F3ECE6; --paper-dark:#EADFD4; --ink:#33302E; --ink-soft:#7A716A; --line:#D8C8B8; --gold:#A9694F; --white:#FFFCF9; }
  body.sec-health{ --paper:#F6F1EA; --paper-dark:#ECE3D6; --ink:#33394A; --ink-soft:#737A88; --line:#D9D2C1; --gold:#7C9483; --white:#FFFEFB; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent;
    transition: background .2s ease; }
  body{ background-image: radial-gradient(circle at 1px 1px, rgba(176,141,87,0.12) 1px, transparent 0);
    background-size: 14px 14px; }
  #app { max-width: 460px; margin: 0 auto; padding: 18px 14px 40px; min-height: 100vh; }

  .view { display: none; }
  .view.active { display: block; }

  /* ---- App title ---- */
  .app-title { font-family: 'Gaegu', cursive; font-weight: 700; font-size: 1.7rem; text-align: center; margin: 6px 0 12px; }

  /* ---- Segmented section tabs (always visible) ---- */
  .seg-tabs { display: flex; gap: 6px; background: var(--paper-dark); border-radius: 14px; padding: 5px; margin-bottom: 14px; }
  .seg-btn { flex: 1; border: none; background: transparent; border-radius: 10px; padding: 9px 4px;
    font-family: 'Noto Sans KR', sans-serif; font-size: 0.86rem; font-weight: 600; color: var(--ink-soft); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 4px; }
  .seg-btn.active { background: var(--white); color: var(--ink); box-shadow: 0 2px 0 rgba(0,0,0,0.08); }
  .sec-sub { font-size: 0.76rem; color: var(--ink-soft); text-align: center; margin: -8px 0 14px 2px; }

  /* ---- Quick "today" row ---- */
  .quick-label { font-size: 0.74rem; color: var(--ink-soft); margin: 0 2px 6px; }
  .quick-row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 4px; margin-bottom: 16px; scrollbar-width: none; }
  .quick-row::-webkit-scrollbar { display: none; }
  .quick-item { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 54px; }
  .quick-circle { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; border: 2.5px solid var(--line); background: var(--white); color: #C3BDA9;
    filter: grayscale(1) opacity(0.55); transition: transform .15s ease; }
  .quick-item.stamped .quick-circle {
    border-color: var(--qcolor, var(--accent)); color: var(--qcolor, var(--accent));
    background: var(--white); filter: url(#inkTexture); mix-blend-mode: multiply;
    animation: stampIn .22s ease-out; box-shadow: inset 0 0 0 1px currentColor;
  }
  .quick-item:active .quick-circle { transform: scale(0.9); }
  .quick-name { font-size: 0.66rem; color: var(--ink-soft); max-width: 54px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quick-empty { font-size: 0.78rem; color: var(--ink-soft); padding: 6px 2px; }

  /* ---- Tabs ---- */
  .tab-row { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
  .tab-row::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; position: relative; display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--white);
    font-size: 0.92rem; font-weight: 500; color: var(--ink-soft); cursor: pointer; white-space: nowrap;
    transition: transform .15s ease, box-shadow .15s ease; }
  .tab.active { color: var(--white); border-color: transparent; box-shadow: 0 3px 0 rgba(0,0,0,0.12); transform: translateY(-1px); background: var(--tab-color, var(--accent)); }
  .tab { transition: transform .14s ease, box-shadow .14s ease; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .tab.dragging { transform: scale(1.07); box-shadow: 0 6px 14px rgba(0,0,0,0.2); opacity: 0.92; z-index: 5; }
  .tab .mini-btn { display: none; margin-left: 2px; font-size: 0.78rem; padding: 2px 4px; }
  .tab-row.edit-mode .tab .mini-btn { display: inline-block; }
  .tab-row.edit-mode .tab { animation: wiggle 0.28s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform: rotate(-0.6deg);} to { transform: rotate(0.6deg);} }

  .tab-add, .tab-edit-toggle { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px dashed var(--gold); background: transparent; color: var(--gold); font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .tab-edit-toggle { border-style: solid; font-size: 0.95rem; }
  .tab-edit-toggle.on { background: var(--ink); color: var(--white); border-color: var(--ink); }

  /* ---- Add / edit panel ---- */
  .add-panel { display: none; background: var(--white); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .add-panel.show { display: block; }
  .add-panel .panel-title { font-family:'Gaegu',cursive; font-weight:700; font-size:1.05rem; margin-bottom:4px; }
  .add-panel label { font-size: 0.78rem; color: var(--ink-soft); display: block; margin: 8px 0 6px; }
  .add-panel input[type=text] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line);
    font-size: 0.95rem; font-family: 'Noto Sans KR', sans-serif; background: var(--paper); }
  .custom-emoji-input { width: 70px !important; text-align: center; font-size: 1.1rem !important; }
  .emoji-row-wrap { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch.selected { border-color: var(--ink); }
  .emoji-pick { display: flex; gap: 6px; flex-wrap: wrap; }
  .emoji-btn { width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper);
    font-size: 1.05rem; cursor: pointer; }
  .emoji-btn.selected { border-color: var(--ink); background: var(--paper-dark); }
  .panel-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
  .btn-primary { background: var(--ink); color: var(--white); }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line); }
  .btn-danger { background: #B0554F; color: var(--white); }

  /* ---- Stats ---- */
  .stats-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .stat-card { flex: 1; background: var(--white); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 4px; text-align: center; }
  .stat-num { font-family: 'Gaegu', cursive; font-weight: 700; font-size: 1.3rem; line-height: 1.1; white-space: nowrap; }
  .stat-label { font-size: 0.66rem; color: var(--ink-soft); margin-top: 2px; }

  /* ---- Calendar ---- */
  .cal-card { background: var(--white); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: 0 4px 0 rgba(0,0,0,0.06); }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav button { background: none; border: none; font-size: 1.1rem; color: var(--ink-soft); cursor: pointer; padding: 4px 10px; }
  .cal-nav button:disabled { opacity: 0.25; cursor: default; }
  .cal-title { font-family: 'Gaegu', cursive; font-weight: 700; font-size: 1.15rem; }

  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
  .weekday-row div { text-align: center; font-size: 0.7rem; color: var(--ink-soft); padding: 4px 0; }

  .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day-cell { position: relative; aspect-ratio: 1 / 1; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-size: 0.8rem; color: var(--ink); background: var(--paper); cursor: pointer; user-select: none; }
  .day-cell.empty { background: transparent; cursor: default; }
  .day-cell.future { color: #C9BFA8; cursor: default; background: transparent; }
  .day-cell.today:not(.stamped) { border: 1.5px solid var(--ink); font-weight: 700; }
  .day-cell .num { position: relative; z-index: 1; }
  .day-cell.stamped .num { opacity: 0; }

  .stamp { position: absolute; inset: 3px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    border: 2.5px solid var(--stamp-color, #C74A3D); color: var(--stamp-color, #C74A3D); font-size: 1rem;
    font-family: 'Gaegu', cursive; mix-blend-mode: multiply; filter: url(#inkTexture);
    animation: stampIn .22s ease-out; box-shadow: inset 0 0 0 1px currentColor; }
  .stamp.dashed { border-radius: 6px; border-style: dashed; }
  .stamp.dashed::after {
    content: '✕'; position: absolute; top: -6px; right: -6px; width: 14px; height: 14px;
    background: var(--stamp-color, #A9694F); color: var(--white); border-radius: 50%; font-size: 0.55rem;
    display: flex; align-items: center; justify-content: center; mix-blend-mode: normal;
  }
  @keyframes stampIn { from { transform: scale(1.6) rotate(var(--tilt, -8deg)); opacity: 0; }
    to { transform: scale(1) rotate(var(--tilt, -8deg)); opacity: 0.92; } }

  .empty-state { text-align: center; padding: 30px 10px; color: var(--ink-soft); font-size: 0.85rem; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--white);
    padding: 9px 16px; border-radius: 999px; font-size: 0.8rem; opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 20;
    max-width: 90%; text-align: center; }
  .toast.show { opacity: 0.95; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(46,53,72,0.45);
    align-items: center; justify-content: center; z-index: 30; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal-card { background: var(--white); border-radius: 16px; padding: 18px; max-width: 300px; width: 100%; text-align: center; }
  .modal-text { font-size: 0.9rem; line-height: 1.5; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 8px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="inkTexture">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="7"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2"/>
  </filter>
</svg>

<div id="app">
  <div class="app-title">🗂️ 트래커</div>

  <div class="seg-tabs" id="segTabs"></div>
  <div class="sec-sub" id="secSub"></div>

  <div class="quick-label">오늘</div>
  <div class="quick-row" id="quickRow"></div>

  <div class="tab-row" id="tabRow"></div>

    <div class="add-panel" id="addPanel">
      <div class="panel-title" id="panelTitle">새 탭 추가</div>
      <label>탭 이름</label>
      <input type="text" id="habitName" placeholder="예: 아침 스트레칭" maxlength="14" />
      <label>아이콘</label>
      <div class="emoji-row-wrap">
        <div class="emoji-pick" id="emojiPick"></div>
      </div>
      <input type="text" id="customEmoji" class="custom-emoji-input" placeholder="✍️" maxlength="8" style="margin-top:8px;" />
      <label>색</label>
      <div class="swatches" id="colorPick"></div>
      <div class="panel-actions">
        <button class="btn btn-ghost" id="cancelAdd">취소</button>
        <button class="btn btn-primary" id="saveAdd">추가하기</button>
      </div>
    </div>

  <div id="mainArea"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-text">이 탭을 삭제할까요?<br>기록도 함께 사라져요.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">취소</button>
      <button class="btn btn-danger" id="modalConfirm">삭제</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const SUPABASE_URL = 'https://sieavhsgclwvkdokylsu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Nf1_W1WY9UaHPz6kubMpNQ_7bo8EdV0';
  const sb = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  const today = new Date();
  const todayKey = dateKey(today);

  function dateKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function parseKey(k){ return new Date(k + 'T00:00:00'); }
  function addDays(d, n){ const c = new Date(d); c.setDate(c.getDate()+n); return c; }
  function diffDays(a, b){ return Math.round((a - b) / 86400000); }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function tilt(seedStr){
    let h = 0;
    for (let i=0;i<seedStr.length;i++) h = (h*31 + seedStr.charCodeAt(i)) % 1000;
    return (h % 16 - 8) + 'deg';
  }
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 1800);
  }

  // ---------------- Section configs ----------------
  const SECTIONS = {
    good: {
      key: 'good-habit-tracker-data',
      title: '🪧 도장판', shortTitle: '도장판',
      sub: '오늘 했으면, 도장 쾅', desc: '좋은 습관을 도장으로 쌓아가요',
      mode: 'positive', bodyClass: '',
      icon: '🪧', accent: '#C74A3D',
      colors: ['#C74A3D', '#6B8F71', '#C98A3E', '#7D5A78', '#3D7C82', '#B0554F'],
      emojis: ['🏃','📖','💪','✏️','🧘','💧','🎨','🎹','🍎','😴','📚','🧹','🥩','🪥','🎯','📝','🧠','🎧','🥗','🚴'],
      defaultHabits: () => ([
        { id: 'h1', name: '운동', emoji: '🏃', color: '#C74A3D' },
        { id: 'h2', name: '영어단어', emoji: '📖', color: '#6B8F71' },
        { id: 'h3', name: '단백질', emoji: '🥩', color: '#C98A3E' },
        { id: 'h5', name: '양치질', emoji: '🪥', color: '#3D7C82' }
      ])
    },
    bad: {
      key: 'bad-habit-tracker-data',
      title: '🚫 절제판', shortTitle: '절제판',
      sub: '했으면 기록, 참을수록 기록이 늘어나요', desc: '줄이고 싶은 습관을 붙잡아봐요',
      mode: 'avoid', bodyClass: 'sec-bad',
      icon: '🚫', accent: '#A9694F',
      colors: ['#A9694F', '#6B7F5E', '#B08A3E', '#7D5A78', '#3D7C82', '#96524B'],
      emojis: ['☕','🚬','🍔','📱','🍺','🍩','🛒','🎮','🥤','🍟','😡','🌙','🀄','🍕','🍰','📺','💸','🛌'],
      defaultHabits: () => ([
        { id: 'h1', name: '커피', emoji: '☕', color: '#A9694F', createdAt: todayKey },
        { id: 'h2', name: '마작', emoji: '🀄', color: '#6B7F5E', createdAt: todayKey }
      ])
    },
    health: {
      key: 'health-tracker-data',
      title: '🩹 건강 기록판', shortTitle: '건강 기록판',
      sub: '있었던 날에 살짝 남겨두기', desc: '몸 상태를 가볍게 기록해요',
      mode: 'neutral', bodyClass: 'sec-health',
      icon: '🩹', accent: '#7C9483',
      colors: ['#7C9483', '#C97B84', '#5E86A6', '#C9A24E', '#8C7AA6', '#B0554F'],
      emojis: ['🚿','🤕','🩸','🤒','😪','💊','🤧','😵‍💫','🌸','😣','🦷','👀','🤢','🥵','🥶','😷','🩹'],
      defaultHabits: () => ([
        { id: 'h1', name: '샤워', emoji: '🚿', color: '#7C9483' },
        { id: 'h2', name: '두통', emoji: '🤕', color: '#5E86A6' },
        { id: 'h3', name: '생리', emoji: '🩸', color: '#C97B84' }
      ])
    }
  };

  const store = {}; // sectionId -> { habits, stamps, updatedAt, seedV2, seedV3 }
  let currentSection = null;
  let activeId = {}; // sectionId -> active habit id
  let editMode = false;
  let viewYear, viewMonth;
  let pickedEmoji = '';
  let pickedColor = '';
  let editingHabitId = null;
  let pendingDelete = null; // { sectionId, habitId }

  // ---------------- storage: local-first, cloud best-effort ----------------
  function persistLocal(id){
    try { localStorage.setItem(SECTIONS[id].key, JSON.stringify(store[id])); } catch(e){}
  }
  async function pushCloud(id){
    if (!sb) return;
    try {
      await sb.from('tracker_kv').upsert({
        key: SECTIONS[id].key,
        value: store[id],
        updated_at: new Date().toISOString()
      });
    } catch(e){ /* silent — will reconcile on next load */ }
  }
  function touchAndSave(id){
    store[id].updatedAt = Date.now();
    persistLocal(id);       // synchronous, instant — survives immediate navigation
    pushCloud(id);          // fire-and-forget background sync
  }

  async function loadSection(id){
    const cfg = SECTIONS[id];
    let local = null, cloud = null;
    try { local = JSON.parse(localStorage.getItem(cfg.key) || 'null'); } catch(e){ local = null; }
    if (sb){
      try {
        const { data: row } = await sb.from('tracker_kv').select('value').eq('key', cfg.key).maybeSingle();
        if (row && row.value) cloud = row.value;
      } catch(e){ /* offline */ }
    }
    let winner;
    if (cloud && local) winner = (local.updatedAt||0) >= (cloud.updatedAt||0) ? local : cloud;
    else winner = cloud || local || { habits: cfg.defaultHabits(), stamps: {} };

    // ensure stamps object matches habits
    winner.stamps = winner.stamps || {};
    winner.habits = winner.habits || [];
    winner.habits.forEach(h => { if (!winner.stamps[h.id]) winner.stamps[h.id] = {}; });
    if (!winner.updatedAt) winner.updatedAt = Date.now();

    store[id] = winner;
    runMigrations(id);
    persistLocal(id);
    pushCloud(id);
  }

  function runMigrations(id){
    const s = store[id];
    if (id === 'good'){
      if (!s.seedV2){
        const wanted = [
          { name: '단백질', emoji: '🥩', color: '#C98A3E' },
          { name: '양치질', emoji: '🪥', color: '#3D7C82' }
        ];
        const names = new Set(s.habits.map(h => h.name));
        wanted.forEach(w => {
          if (!names.has(w.name)){
            const id2 = newId();
            s.habits.push({ id: id2, name: w.name, emoji: w.emoji, color: w.color });
            s.stamps[id2] = {};
          }
        });
        s.seedV2 = true;
      }
      if (!s.seedV3){
        const shower = s.habits.find(h => h.name === '샤워');
        if (shower){
          s.habits = s.habits.filter(h => h.id !== shower.id);
          delete s.stamps[shower.id];
        }
        s.seedV3 = true;
      }
    }
    if (id === 'bad' || id === 'good'){
      s.habits.forEach(h => {
        if (id === 'bad' && !h.createdAt){
          const marks = Object.keys(s.stamps[h.id] || {}).filter(k => s.stamps[h.id][k]).sort();
          h.createdAt = marks.length ? marks[0] : todayKey;
        }
      });
    }
  }

  function newId(){ return 'h_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  // ---------------- streak / stats calculations ----------------
  function computePositiveStreaks(habitId, stamps){
    const keys = Object.keys(stamps).filter(k => stamps[k]).sort();
    if (!keys.length) return { current: 0, max: 0, total: 0 };
    const dateSet = new Set(keys);
    let max = 0, run = 0, prev = null;
    for (const k of keys){
      if (prev){
        const nextExpected = dateKey(addDays(parseKey(prev), 1));
        run = (nextExpected === k) ? run + 1 : 1;
      } else run = 1;
      max = Math.max(max, run);
      prev = k;
    }
    let cursor = new Date(today);
    if (!dateSet.has(dateKey(cursor))) cursor = addDays(cursor, -1);
    let current = 0;
    while (dateSet.has(dateKey(cursor))){ current += 1; cursor = addDays(cursor, -1); }
    return { current, max, total: keys.length };
  }

  function computeAvoidStreaks(stamps, createdAt){
    const keys = Object.keys(stamps).filter(k => stamps[k]).sort();
    const markSet = new Set(keys);
    const start = parseKey(createdAt || todayKey);
    if (start > today) return { current: 0, max: 0, total: keys.length };
    let max = 0, run = 0;
    let cursor = new Date(start);
    while (cursor <= today){
      const k = dateKey(cursor);
      if (markSet.has(k)) run = 0; else run += 1;
      if (run > max) max = run;
      cursor = addDays(cursor, 1);
    }
    return { current: run, max, total: keys.length };
  }

  function computeHealthStats(stamps){
    const keys = Object.keys(stamps).filter(k => stamps[k]).sort();
    const total = keys.length;
    const monthPrefix = todayKey.slice(0,7);
    const monthCount = keys.filter(k => k.startsWith(monthPrefix)).length;
    let lastLabel = '–';
    if (keys.length){
      const days = diffDays(today, parseKey(keys[keys.length-1]));
      lastLabel = days === 0 ? '오늘' : days + '일전';
    }
    return { total, monthCount, lastLabel };
  }

  function habitStreak(sectionId, habit){
    const cfg = SECTIONS[sectionId];
    const stamps = store[sectionId].stamps[habit.id] || {};
    if (cfg.mode === 'positive') return computePositiveStreaks(habit.id, stamps);
    if (cfg.mode === 'avoid') return computeAvoidStreaks(stamps, habit.createdAt);
    return computeHealthStats(stamps);
  }

  // ---------------- long-press drag reorder for tabs ----------------
  const LONG_PRESS_MS = 380;
  const MOVE_CANCEL_PX = 8;
  let dragState = null;
  let justDraggedTab = false;

  function tabPointerDown(e, habitId){
    if (e.target.closest('.mini-btn')) return;
    if (dragState) return;
    dragState = {
      habitId, sectionId: currentSection,
      startX: e.clientX, startY: e.clientY,
      dragging: false,
      timer: null
    };
    dragState.timer = setTimeout(() => {
      if (!dragState) return;
      dragState.dragging = true;
      const el = document.querySelector(`#tabRow .tab[data-habit-id="${dragState.habitId}"]`);
      if (el) el.classList.add('dragging');
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch(err){} }
    }, LONG_PRESS_MS);
  }

  document.addEventListener('pointermove', (e) => {
    if (!dragState) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    if (!dragState.dragging){
      if (Math.abs(dx) > MOVE_CANCEL_PX || Math.abs(dy) > MOVE_CANCEL_PX){
        clearTimeout(dragState.timer);
        dragState = null;
      }
      return;
    }
    e.preventDefault();
    const id = dragState.sectionId;
    const tabs = Array.from(document.querySelectorAll('#tabRow .tab'));
    const habits = store[id].habits;
    const curIndex = habits.findIndex(h => h.id === dragState.habitId);
    if (curIndex === -1) return;
    let targetIndex = curIndex;
    for (let i = 0; i < tabs.length; i++){
      const rect = tabs[i].getBoundingClientRect();
      const center = rect.left + rect.width / 2;
      if (e.clientX >= rect.left && e.clientX <= rect.right){
        targetIndex = i;
        break;
      }
      if (e.clientX < center){ targetIndex = i; break; }
    }
    if (targetIndex !== curIndex){
      const [moved] = habits.splice(curIndex, 1);
      habits.splice(targetIndex, 0, moved);
      renderTabs();
      renderQuickRow();
      const el = document.querySelector(`#tabRow .tab[data-habit-id="${dragState.habitId}"]`);
      if (el) el.classList.add('dragging');
    }
  }, { passive: false });

  document.addEventListener('pointerup', () => {
    if (!dragState) return;
    if (dragState.dragging){
      justDraggedTab = true;
      touchAndSave(dragState.sectionId);
      const el = document.querySelector(`#tabRow .tab[data-habit-id="${dragState.habitId}"]`);
      if (el) el.classList.remove('dragging');
    } else {
      clearTimeout(dragState.timer);
    }
    dragState = null;
  });

  document.addEventListener('pointercancel', () => {
    if (dragState){
      clearTimeout(dragState.timer);
      const el = document.querySelector(`#tabRow .tab[data-habit-id="${dragState.habitId}"]`);
      if (el) el.classList.remove('dragging');
    }
    dragState = null;
  });

  // ---------------- top segmented section tabs ----------------
  function renderSegTabs(){
    const wrap = document.getElementById('segTabs');
    wrap.innerHTML = '';
    Object.keys(SECTIONS).forEach(id => {
      const cfg = SECTIONS[id];
      const b = document.createElement('button');
      b.className = 'seg-btn' + (id === currentSection ? ' active' : '');
      b.innerHTML = `<span>${cfg.icon}</span><span>${cfg.shortTitle}</span>`;
      b.addEventListener('click', () => switchSection(id));
      wrap.appendChild(b);
    });
  }

  function switchSection(id){
    currentSection = id;
    document.body.className = SECTIONS[id].bodyClass;
    document.documentElement.style.setProperty('--accent', SECTIONS[id].accent);
    document.getElementById('secSub').textContent = SECTIONS[id].sub;
    editMode = false;
    if (!activeId[id] && store[id].habits.length) activeId[id] = store[id].habits[0].id;
    renderSegTabs();
    renderQuickRow();
    renderTabs();
    renderMain();
  }

  // ---------------- "today" quick-stamp row ----------------
  function renderQuickRow(){
    const id = currentSection;
    const wrap = document.getElementById('quickRow');
    wrap.innerHTML = '';
    if (!store[id].habits.length){
      wrap.innerHTML = '<div class="quick-empty">아직 탭이 없어요. 아래 ➕로 추가해보세요.</div>';
      return;
    }
    store[id].habits.forEach(h => {
      const stamped = !!(store[id].stamps[h.id] || {})[todayKey];
      const item = document.createElement('div');
      item.className = 'quick-item' + (stamped ? ' stamped' : '');
      item.innerHTML = `<div class="quick-circle" style="--qcolor:${h.color}">${h.emoji}</div><div class="quick-name">${escapeHtml(h.name)}</div>`;
      item.addEventListener('click', () => {
        const map = store[id].stamps[h.id] || (store[id].stamps[h.id] = {});
        map[todayKey] = !map[todayKey];
        touchAndSave(id);
        renderQuickRow();
        if (activeId[id] === h.id) renderMain();
      });
      wrap.appendChild(item);
    });
  }

  // ---------------- tabs ----------------
  function renderTabs(){
    const id = currentSection;
    const cfg = SECTIONS[id];
    const row = document.getElementById('tabRow');
    row.className = 'tab-row' + (editMode ? ' edit-mode' : '');
    row.innerHTML = '';

    store[id].habits.forEach(h => {
      const el = document.createElement('div');
      el.className = 'tab' + (h.id === activeId[id] ? ' active' : '');
      el.dataset.habitId = h.id;
      if (h.id === activeId[id]) el.style.setProperty('--tab-color', h.color);
      el.innerHTML = `<span>${h.emoji}</span><span>${escapeHtml(h.name)}</span><span class="mini-btn" data-act="edit" data-id="${h.id}">✎</span><span class="mini-btn" data-act="del" data-id="${h.id}">✕</span>`;
      el.addEventListener('pointerdown', (e) => tabPointerDown(e, h.id));
      el.addEventListener('click', (e) => {
        if (justDraggedTab){ justDraggedTab = false; return; }
        if (editMode){
          const btn = e.target.closest('.mini-btn');
          if (btn && btn.dataset.act === 'del') requestDelete(id, btn.dataset.id);
          if (btn && btn.dataset.act === 'edit') openEditPanel(btn.dataset.id);
          return;
        }
        activeId[id] = h.id;
        renderAll();
      });
      row.appendChild(el);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'tab-add';
    addBtn.textContent = '+';
    addBtn.addEventListener('click', () => openAddPanel());
    row.appendChild(addBtn);

    const editBtn = document.createElement('button');
    editBtn.className = 'tab-edit-toggle' + (editMode ? ' on' : '');
    editBtn.textContent = '✎';
    editBtn.addEventListener('click', () => { editMode = !editMode; renderTabs(); document.getElementById('addPanel').classList.remove('show'); });
    row.appendChild(editBtn);
  }

  // ---------------- add / edit panel ----------------
  function openAddPanel(){
    editingHabitId = null;
    document.getElementById('panelTitle').textContent = '새 탭 추가';
    document.getElementById('saveAdd').textContent = '추가하기';
    document.getElementById('habitName').value = '';
    document.getElementById('customEmoji').value = '';
    const cfg = SECTIONS[currentSection];
    pickedEmoji = cfg.emojis[0];
    pickedColor = cfg.colors[store[currentSection].habits.length % cfg.colors.length];
    document.getElementById('addPanel').classList.add('show');
    renderPickers();
  }

  function openEditPanel(habitId){
    const h = store[currentSection].habits.find(x => x.id === habitId);
    if (!h) return;
    editingHabitId = habitId;
    document.getElementById('panelTitle').textContent = '탭 수정';
    document.getElementById('saveAdd').textContent = '수정 완료';
    document.getElementById('habitName').value = h.name;
    document.getElementById('customEmoji').value = '';
    pickedEmoji = h.emoji;
    pickedColor = h.color;
    document.getElementById('addPanel').classList.add('show');
    renderPickers();
  }

  function renderPickers(){
    const cfg = SECTIONS[currentSection];
    const ep = document.getElementById('emojiPick');
    ep.innerHTML = '';
    cfg.emojis.forEach(e => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'emoji-btn' + (e === pickedEmoji ? ' selected' : '');
      b.textContent = e;
      b.addEventListener('click', () => { pickedEmoji = e; document.getElementById('customEmoji').value=''; renderPickers(); });
      ep.appendChild(b);
    });
    const cp = document.getElementById('colorPick');
    cp.innerHTML = '';
    cfg.colors.forEach(c => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch' + (c === pickedColor ? ' selected' : '');
      b.style.background = c;
      b.addEventListener('click', () => { pickedColor = c; renderPickers(); });
      cp.appendChild(b);
    });
  }

  document.getElementById('customEmoji').addEventListener('input', (e) => {
    const v = e.target.value.trim();
    if (v) { pickedEmoji = v; renderPickers(); }
  });

  document.getElementById('cancelAdd').addEventListener('click', () => {
    document.getElementById('addPanel').classList.remove('show');
    editingHabitId = null;
  });

  document.getElementById('saveAdd').addEventListener('click', () => {
    const id = currentSection;
    const name = document.getElementById('habitName').value.trim();
    if (!name){ showToast('이름을 입력해주세요'); return; }
    if (!pickedEmoji){ showToast('아이콘을 골라주세요'); return; }

    if (editingHabitId){
      const h = store[id].habits.find(x => x.id === editingHabitId);
      if (h){ h.name = name; h.emoji = pickedEmoji; h.color = pickedColor; }
    } else {
      const hid = newId();
      const habit = { id: hid, name, emoji: pickedEmoji, color: pickedColor };
      if (SECTIONS[id].mode === 'avoid') habit.createdAt = todayKey;
      store[id].habits.push(habit);
      store[id].stamps[hid] = {};
      activeId[id] = hid;
    }
    editingHabitId = null;
    document.getElementById('addPanel').classList.remove('show');
    touchAndSave(id);
    renderAll();
  });

  // ---------------- delete ----------------
  function requestDelete(sectionId, habitId){
    pendingDelete = { sectionId, habitId };
    document.getElementById('modalOverlay').classList.add('show');
  }
  document.getElementById('modalCancel').addEventListener('click', () => {
    pendingDelete = null;
    document.getElementById('modalOverlay').classList.remove('show');
  });
  document.getElementById('modalConfirm').addEventListener('click', () => {
    if (!pendingDelete) return;
    const { sectionId, habitId } = pendingDelete;
    document.getElementById('modalOverlay').classList.remove('show');
    const s = store[sectionId];
    s.habits = s.habits.filter(h => h.id !== habitId);
    delete s.stamps[habitId];
    if (activeId[sectionId] === habitId) activeId[sectionId] = s.habits.length ? s.habits[0].id : null;
    pendingDelete = null;
    touchAndSave(sectionId);
    renderAll();
    showToast('삭제했어요');
  });

  // ---------------- main area / calendar ----------------
  function renderMain(){
    const id = currentSection;
    const cfg = SECTIONS[id];
    const area = document.getElementById('mainArea');
    if (!store[id].habits.length){
      area.innerHTML = '<div class="empty-state">아직 탭이 없어요.<br>➕ 눌러서 첫 항목을 추가해보세요.</div>';
      return;
    }
    const habit = store[id].habits.find(h => h.id === activeId[id]) || store[id].habits[0];
    activeId[id] = habit.id;
    const stats = habitStreak(id, habit);

    let cards;
    if (cfg.mode === 'positive'){
      cards = [
        ['총 도장', stats.total], ['현재 연속', stats.current], ['최대 연속', stats.max]
      ];
    } else if (cfg.mode === 'avoid'){
      cards = [
        ['총 기록', stats.total], ['지금 참은 날', stats.current], ['최고 기록', stats.max]
      ];
    } else {
      cards = [
        ['총 기록', stats.total], ['이번 달', stats.monthCount], ['마지막 기록', stats.lastLabel]
      ];
    }

    area.innerHTML = `
      <div class="stats-row">
        ${cards.map(([label,val]) => `<div class="stat-card"><div class="stat-num" style="color:${habit.color}">${val}</div><div class="stat-label">${label}</div></div>`).join('')}
      </div>
      <div class="cal-card">
        <div class="cal-nav">
          <button id="prevMonth">◀</button>
          <div class="cal-title">${viewYear}년 ${viewMonth+1}월</div>
          <button id="nextMonth" ${isCurrentMonth() ? 'disabled' : ''}>▶</button>
        </div>
        <div class="weekday-row">${['일','월','화','수','목','금','토'].map(d=>`<div>${d}</div>`).join('')}</div>
        <div class="day-grid" id="dayGrid"></div>
      </div>
    `;

    document.getElementById('prevMonth').addEventListener('click', () => { changeMonth(-1); });
    document.getElementById('nextMonth').addEventListener('click', () => { changeMonth(1); });

    renderDayGrid(habit);
  }

  function isCurrentMonth(){ return viewYear === today.getFullYear() && viewMonth === today.getMonth(); }
  function changeMonth(delta){
    viewMonth += delta;
    if (viewMonth < 0){ viewMonth = 11; viewYear -= 1; }
    if (viewMonth > 11){ viewMonth = 0; viewYear += 1; }
    renderMain();
  }

  function renderDayGrid(habit){
    const id = currentSection;
    const cfg = SECTIONS[id];
    const grid = document.getElementById('dayGrid');
    grid.innerHTML = '';
    const firstDay = new Date(viewYear, viewMonth, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

    for (let i=0;i<startWeekday;i++){
      const blank = document.createElement('div');
      blank.className = 'day-cell empty';
      grid.appendChild(blank);
    }

    const stampMap = store[id].stamps[habit.id] || {};

    for (let d=1; d<=daysInMonth; d++){
      const cellDate = new Date(viewYear, viewMonth, d);
      const key = dateKey(cellDate);
      const isFuture = cellDate > today;
      const isToday = key === todayKey;
      const isStamped = !!stampMap[key];

      const cell = document.createElement('div');
      cell.className = 'day-cell' + (isFuture ? ' future' : '') + (isToday ? ' today' : '') + (isStamped ? ' stamped' : '');
      cell.innerHTML = `<span class="num">${d}</span>`;

      if (isStamped){
        const stamp = document.createElement('div');
        stamp.className = 'stamp' + (cfg.mode === 'avoid' ? ' dashed' : '');
        stamp.style.setProperty('--stamp-color', habit.color);
        stamp.style.setProperty('--tilt', tilt(key + habit.id));
        stamp.textContent = habit.emoji;
        cell.appendChild(stamp);
      }

      if (!isFuture){
        cell.addEventListener('click', () => {
          const map = store[id].stamps[habit.id] || (store[id].stamps[habit.id] = {});
          map[key] = !map[key];
          touchAndSave(id);
          renderMain();
          if (key === todayKey) renderQuickRow();
        });
      }

      grid.appendChild(cell);
    }
  }

  function renderAll(){ renderQuickRow(); renderTabs(); renderMain(); }

  // ---------------- init ----------------
  (async function init(){
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    await Promise.all(Object.keys(SECTIONS).map(loadSection));
    switchSection(Object.keys(SECTIONS)[0]);
  })();
})();
</script>
